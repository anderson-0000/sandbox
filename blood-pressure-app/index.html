<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>血圧管理アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>血圧管理アプリ</h1>

    <div class="container">
        <div class="input-area">
            <h2>データ入力</h2>
            <form id="bp-form">
                <label for="date">日付:</label>
                <input type="date" id="date" required>

                <label for="time">時刻:</label>
                <input type="time" id="time" required>

                <label for="systolic">最高血圧 (mmHg):</label>
                <input type="number" id="systolic" placeholder="例: 120" required>

                <label for="diastolic">最低血圧 (mmHg):</label>
                <input type="number" id="diastolic" placeholder="例: 80" required>

                <label for="pulse">心拍数 (bpm):</label>
                <input type="number" id="pulse" placeholder="例: 70" required>

                <button type="submit">記録する</button>
            </form>
            <div class="note">
                <p>※「記録する」ボタンを押すと、更新されたデータファイル（data.json）のダウンロードが始まります。ダウンロードしたファイルを、現在開いているフォルダにある同名のファイルに上書き保存してください。</p>
            </div>
        </div>

        <div class="chart-area">
            <div class="chart-header">
                <h2>血圧・心拍数グラフ</h2>
                <button id="download-chart-btn">JPEGで保存</button>
            </div>
            <div class="chart-wrapper">
                <canvas id="bp-chart"></canvas>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>

    <div class="data-display-area">
        <h2>記録データ一覧</h2>
        <div id="data-table-container">
            <!-- ここにデータが表示されます -->
        </div>
    </div>
</body>
</html>
