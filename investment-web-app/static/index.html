<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投資信託シミュレーター</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>投資信託シミュレーター</h1>

        <div class="general-settings investment-form-container" style="max-width: 600px; margin: 0 auto 20px auto; text-align: center;">
            <div style="display: flex; justify-content: center; gap: 20px; align-items: center;">
                <div>
                    <label for="current_age">現在の年齢:</label>
                    <input type="number" id="current_age" min="0" value="30" style="width: 80px;">
                </div>
                <div>
                    <label for="existing_savings">既存貯金 (万円):</label>
                    <input type="number" id="existing_savings" min="0" value="0" style="width: 120px;">
                </div>
            </div>
        </div>

        <div class="forms-section">
            <div class="investment-form-container">
                <h2>投資信託 1</h2>
                <div class="input-row" style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <div style="flex: 1;">
                        <label for="inv1_initial">初期投資 (万):</label>
                        <input type="number" id="inv1_initial" min="0" style="width: 100%; box-sizing: border-box;">
                    </div>
                    <div style="flex: 1;">
                        <label for="inv1_monthly">毎月積立 (万):</label>
                        <input type="number" id="inv1_monthly" min="0" style="width: 100%; box-sizing: border-box;">
                    </div>
                </div>

                <div class="input-row" style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <div style="flex: 1;">
                        <label for="inv1_return">リターン (%):</label>
                        <input type="number" id="inv1_return" step="0.1" min="0" style="width: 100%; box-sizing: border-box;">
                    </div>
                    <div style="flex: 1;">
                        <label for="inv1_risk">リスク (%):</label>
                        <input type="number" id="inv1_risk" step="0.1" min="0" style="width: 100%; box-sizing: border-box;">
                    </div>
                </div>

                <label for="inv1_period">投資期間 (年):</label>
                <input type="number" id="inv1_period" min="1">

                <h3>積立額変更設定</h3>
                <div id="inv1_change_settings_container">
                    <div class="change-setting-item">
                        <label>何年後:</label>
                        <input type="number" class="change-setting-year" min="1" value="">
                        <label>変更後の積立額 (万円):</label>
                        <input type="number" class="change-setting-monthly" min="0" value="">
                        <button type="button" class="remove-change-setting">削除</button>
                    </div>
                </div>
                <button type="button" id="addInv1ChangeSettingButton">積立額変更を追加</button>
            </div>

            <div class="investment-form-container">
                <h2>投資信託 2</h2>
                <div class="input-row" style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <div style="flex: 1;">
                        <label for="inv2_initial">初期投資 (万):</label>
                        <input type="number" id="inv2_initial" min="0" style="width: 100%; box-sizing: border-box;">
                    </div>
                    <div style="flex: 1;">
                        <label for="inv2_monthly">毎月積立 (万):</label>
                        <input type="number" id="inv2_monthly" min="0" style="width: 100%; box-sizing: border-box;">
                    </div>
                </div>

                <div class="input-row" style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <div style="flex: 1;">
                        <label for="inv2_return">リターン (%):</label>
                        <input type="number" id="inv2_return" step="0.1" min="0" style="width: 100%; box-sizing: border-box;">
                    </div>
                    <div style="flex: 1;">
                        <label for="inv2_risk">リスク (%):</label>
                        <input type="number" id="inv2_risk" step="0.1" min="0" style="width: 100%; box-sizing: border-box;">
                    </div>
                </div>

                <label for="inv2_period">投資期間 (年):</label>
                <input type="number" id="inv2_period" min="1">

                <h3>積立額変更設定</h3>
                <div id="inv2_change_settings_container">
                    <div class="change-setting-item">
                        <label>何年後:</label>
                        <input type="number" class="change-setting-year" min="1" value="">
                        <label>変更後の積立額 (万円):</label>
                        <input type="number" class="change-setting-monthly" min="0" value="">
                        <button type="button" class="remove-change-setting">削除</button>
                    </div>
                </div>
                <button type="button" id="addInv2ChangeSettingButton">積立額変更を追加</button>
            </div>
        </div>

        <div class="market-event-section investment-form-container" style="max-width: 800px; margin: 20px auto;">
            <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                <input type="checkbox" id="crash_enabled" style="width: 20px; height: 20px;">
                <h2 style="margin: 0;">定期的な相場急落 (ストレスチェック)</h2>
            </div>
            <div id="crash_settings" style="margin-top: 15px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; text-align: center;">
                <div>
                    <label for="crash_year">初回発生 (何年後):</label>
                    <input type="number" id="crash_year" min="1" value="5" style="width: 100%; box-sizing: border-box;">
                </div>
                <div>
                    <label for="crash_interval">発生周期 (年):</label>
                    <input type="number" id="crash_interval" min="1" value="10" style="width: 100%; box-sizing: border-box;">
                </div>
                <div>
                    <label for="crash_rate">下落率 (%):</label>
                    <input type="number" id="crash_rate" min="0" max="100" value="30" style="width: 100%; box-sizing: border-box;">
                </div>
            </div>
            <p class="help-text" style="font-size: 0.8em; color: #666; margin-top: 10px; text-align: center;">
                ※有効にすると、指定した周期で資産全体に暴落が発生します。過去の統計では10年に一度、30〜50%の下落が観測されています。
            </p>
        </div>

        <div class="life-events-section">
            <h2>ライフイベント費用</h2>
            <div id="life_events_container">
                <div class="life-event-item">
                    <label>何年後:</label>
                    <input type="number" class="life-event-year" min="1" value="">
                    <label>金額 (万円):</label>
                    <input type="number" class="life-event-amount" min="0" value="">
                    <button type="button" class="remove-life-event">削除</button>
                </div>
            </div>
            <button type="button" id="addLifeEventButton">ライフイベントを追加</button>
        </div>

        <button id="simulateButton">シミュレーション実行</button>

        <div class="results-section">
            <h2>シミュレーション結果</h2>
            <div class="chart-container">
                <canvas id="simulationChart"></canvas>
                <button id="downloadChartButton">グラフをダウンロード</button>
            </div>
            <div class="chart-controls">
                <label>
                    <input type="checkbox" id="toggleSamplePaths"> 個別パスを表示
                </label>
                <label>
                    表示パス数: <span id="samplePathsCount">5</span>
                    <input type="range" id="samplePathsSlider" min="0" max="100" value="5">
                </label>
            </div>
            <h3>年次推移</h3>
            <div class="table-container">
                <table id="resultsTable">
                    <thead>
                        <tr>
                            <th>年</th>
                            <th>最小値</th>
                            <th>10%</th>
                            <th>中央値 (50%)</th>
                            <th>90%</th>
                            <th>最大値</th>
                            <th>平均値</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Results will be inserted here -->
                    </tbody>
                </table>
            </div>

            <h3>最終結果の要約 (最終年)</h3>
            <div class="table-container">
                <table id="summaryTable">
                    <thead>
                        <tr>
                            <th>最小値</th>
                            <th>10%</th>
                            <th>中央値 (50%)</th>
                            <th>90%</th>
                            <th>最大値</th>
                            <th>平均値</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Summary will be inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="/script.js"></script>
</body>
</html>
